<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Correção de Essay Profissional</title>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <script type="text/javascript">
        (function(){
            try {
                emailjs.init("1BvdNaJEUkYjlSQhC");
                console.log('EmailJS inicializado com sucesso');
            } catch (error) {
                console.error('Erro ao inicializar EmailJS:', error);
            }
        })();
    </script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #E8E9EA;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        h1 {
            color: #2a506f;
            text-align: center;
            margin-bottom: 10px;
            font-size: 2em;
        }
        .subtitle { text-align: center; color: #666; margin-bottom: 30px; font-size: 1.1em; }
        .delivery-time { text-align: center; color: #888; font-size: 0.85em; margin-bottom: 5px; }
        .calculator-section {
            background: #f8f9ff;
            padding: 30px;
            border-radius: 15px;
            margin-bottom: 30px;
        }
        .calculator-title {
            color: #2a506f;
            font-size: 1.3em;
            margin-bottom: 20px;
            text-align: center;
            font-weight: 600;
        }
        .input-group { margin-bottom: 20px; }
        label { display: block; color: #333; font-weight: 600; margin-bottom: 8px; }
        input[type="number"], input[type="text"], input[type="email"], input[type="tel"], input[type="file"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
        }
        .result {
            background: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            margin-top: 20px;
            border: 3px solid #2a506f;
        }
        .result-label { color: #666; font-size: 0.9em; margin-bottom: 5px; }
        .result-value { color: #2a506f; font-size: 2em; font-weight: bold; }
        .cta-button {
            width: 100%;
            padding: 18px;
            background: #2a506f;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.2em;
            font-weight: 600;
            cursor: pointer;
            margin-top: 20px;
        }
        .hidden { display: none; }
        .back-button { background: #6c757d; margin-bottom: 20px; padding: 12px; font-size: 1em; }
        .pix-info {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
            border-left: 4px solid #2a506f;
        }
        .success-message {
            background: #d4edda;
            color: #155724;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }
        .file-input-wrapper { position: relative; }
        .file-input-label {
            background: #2a506f;
            color: white;
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            display: block;
            text-align: center;
        }
        input[type="file"] { position: absolute; left: -9999px; }
        .file-name { margin-top: 8px; color: #666; font-size: 0.9em; text-align: center; }
    </style>
</head>
<body>
<div class="container">

    <div id="mainPage">
        <h1>Correção de Essay de Application</h1>
        <p class="delivery-time">Em até 2 dias</p>
        <p class="subtitle">Por Bruna Guedes</p>

        <div class="calculator-section">
            <div class="input-group">
                <label for="wordCount">Quantas palavras tem sua essay?</label>
                <input type="number" id="wordCount" min="1">
            </div>
            <div class="result">
                <div class="result-label">Valor total:</div>
                <div class="result-value" id="totalPrice">R$ 0,00</div>
            </div>
        </div>

        <button class="cta-button" id="scheduleButton">Quero agendar minha revisão</button>
    </div>

    <div id="formPage" class="hidden">
        <button class="cta-button back-button" id="backButton">← Voltar</button>
        <h1>Formulário de Revisão</h1>

        <div class="pix-info">
            <strong>Chave Pix:</strong> thisisbrunag@gmail.com<br>
            <strong>Valor:</strong> <span id="formPrice">R$ 0,00</span>
        </div>

        <form id="submissionForm">
            <div class="input-group">
                <label>Nome completo *</label>
                <input type="text" id="name_input" name="name">
            </div>

            <div class="input-group">
                <label>WhatsApp *</label>
                <input type="tel" id="phone" name="whatsapp">
            </div>

            <div class="input-group">
                <label>E-mail *</label>
                <input type="email" id="email_input" name="email">
            </div>

            <div class="input-group">
                <label>Link da essay no Google Docs *</label>
                <input type="text" id="docsLink" name="link_docs">
            </div>

            <input type="hidden" name="valor" id="valor_hidden">
            <input type="hidden" name="palavras" id="palavras_hidden">
            <input type="hidden" name="comprovante" id="comprovante_hidden">
            <input type="hidden" name="message" id="message_hidden">

            <div class="input-group">
                <label>Comprovante de Pagamento * (max 500KB)</label>
                <div class="file-input-wrapper">
                    <label for="paymentProof" class="file-input-label">Anexe o comprovante</label>
                    <input
                        type="file"
                        id="paymentProof"
                        accept="image/*,.pdf"
                    >
                </div>
                <div class="file-name" id="fileName">Nenhum arquivo selecionado</div>
            </div>

            <button type="button" class="cta-button">Enviar Solicitação</button>
        </form>
    </div>

    <div id="successPage" class="hidden">
        <div class="success-message">
            <h2>Solicitação Enviada com Sucesso!</h2>
            <p>Você receberá retorno por e-mail.</p>
        </div>
    </div>

</div>

<script>
let currentPrice = 0;
const pricePerWord = 0.40;

document.getElementById('wordCount').addEventListener('input', e => {
    currentPrice = (parseInt(e.target.value) || 0) * pricePerWord;
    document.getElementById('totalPrice').textContent =
        'R$ ' + currentPrice.toFixed(2).replace('.', ',');
});

document.getElementById('scheduleButton').onclick = () => {
    if (!currentPrice) return alert('Calcule o valor primeiro!');
    document.getElementById('mainPage').classList.add('hidden');
    document.getElementById('formPage').classList.remove('hidden');
    document.getElementById('formPrice').textContent =
        'R$ ' + currentPrice.toFixed(2).replace('.', ',');
};

document.getElementById('backButton').onclick = () => {
    document.getElementById('formPage').classList.add('hidden');
    document.getElementById('mainPage').classList.remove('hidden');
};

document.getElementById('paymentProof').addEventListener('change', e => {
    const file = e.target.files[0];
    if (!file) {
        document.getElementById('fileName').textContent = 'Nenhum arquivo selecionado';
        return;
    }
    
    // Check file size (500KB limit to avoid 413 error)
    const maxSize = 500 * 1024; // 500KB
    if (file.size > maxSize) {
        alert('Arquivo muito grande! Por favor, envie um arquivo menor que 500KB.');
        e.target.value = '';
        document.getElementById('fileName').textContent = 'Nenhum arquivo selecionado';
        return;
    }
    
    document.getElementById('fileName').textContent = file.name;
});

document.querySelector('#submissionForm button').onclick = () => {
    const form = document.getElementById('submissionForm');
    const fileInput = document.getElementById('paymentProof');
    const file = fileInput.files[0];
    
    // Set hidden fields
    document.getElementById('valor_hidden').value = currentPrice.toFixed(2);
    document.getElementById('palavras_hidden').value = document.getElementById('wordCount').value;
    
    if (!file) {
        alert('Por favor, anexe o comprovante de pagamento!');
        return;
    }
    
    // Convert file to base64
    const reader = new FileReader();
    reader.onload = function(e) {
        const base64 = e.target.result;
        
        // Set the base64 in hidden field
        document.getElementById('comprovante_hidden').value = base64;
        document.getElementById('message_hidden').value = `
Nome: ${document.getElementById('name_input').value}
WhatsApp: ${document.getElementById('phone').value}
Email: ${document.getElementById('email_input').value}
Link: ${document.getElementById('docsLink').value}
Valor: R$ ${currentPrice.toFixed(2)}
Palavras: ${document.getElementById('wordCount').value}
        `.trim();
        
        // Send with EmailJS
        emailjs.sendForm('service_jwp8w1g', 'template_djc9cz7', form)
            .then(() => {
                document.getElementById('formPage').classList.add('hidden');
                document.getElementById('successPage').classList.remove('hidden');
            })
            .catch(err => {
                if (err.status === 413) {
                    alert('Arquivo muito grande! Por favor, envie um comprovante menor (max 500KB) ou envie pelo WhatsApp.');
                } else {
                    alert('Erro ao enviar. Tente novamente ou entre em contato pelo WhatsApp.');
                }
                console.error(err);
            });
    };
    
    reader.readAsDataURL(file);
};
</script>
</body>
</html>
